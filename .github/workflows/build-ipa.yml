name: build-ipa

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    # macos-14 是 Apple Silicon，部分账户不支持该配置（会报
    # "The configuration 'macos-14-arm64-us-default' is not supported"）
    # 这里用 Intel 的 macos-13，交叉编译 iOS arm64 没有任何问题
    runs-on: macos-13

    steps:
      - uses: actions/checkout@v4

      - name: 选择 Xcode
        run: |
          if [ -d /Applications/Xcode_15.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          elif [ -d /Applications/Xcode_15.2.app ]; then
            sudo xcode-select -s /Applications/Xcode_15.2.app
          elif [ -d /Applications/Xcode_15.0.1.app ]; then
            sudo xcode-select -s /Applications/Xcode_15.0.1.app
          else
            echo "使用镜像默认 Xcode"
          fi
          xcodebuild -version

      - name: 安装 xcodegen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 安装 CocoaPods 依赖
        run: pod install

      - name: 编译（不签名）
        run: |
          xcodebuild \
            -workspace LlmWiki.xcworkspace \
            -scheme LlmWiki \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: 打包成 ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/LlmWiki.app Payload/
          zip -r LlmWiki-unsigned.ipa Payload

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: LlmWiki-ipa
          path: LlmWiki-unsigned.ipa
