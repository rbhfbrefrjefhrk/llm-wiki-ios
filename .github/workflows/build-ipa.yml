name: build-ipa

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    # 账户不支持 arm64 配置（macos-14/15 都会报 "configuration not supported"），
    # 因此使用 GitHub 保留的 Intel 镜像 macos-15-intel
    runs-on: macos-15-intel

    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: 安装 xcodegen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 安装 CocoaPods 依赖
        run: pod install

      - name: 编译（不签名）
        run: |
          xcodebuild \
            -workspace LlmWiki.xcworkspace \
            -scheme LlmWiki \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: 打包成 ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/LlmWiki.app Payload/
          zip -r LlmWiki-unsigned.ipa Payload

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: LlmWiki-ipa
          path: LlmWiki-unsigned.ipa
